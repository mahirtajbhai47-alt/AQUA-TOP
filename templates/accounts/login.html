{% extends "base.html" %}

{% block content %}
<section class="section bg-aqua-soft">
  <div class="container">
    <div class="row justify-content-center"><div class="col-md-8 col-lg-5">
      <div class="form-panel">
        <div class="text-center mb-4">
          <div class="icon-circle mx-auto"><i class="bi bi-box-arrow-in-right"></i></div>
          <h1 class="h4 mb-1">Welcome back</h1>
          <p class="small text-muted-soft mb-0">Login to track orders and service requests.</p>
        </div>
        <form method="post" novalidate>
          {% csrf_token %}
          {% if form.non_field_errors %}<div class="alert alert-danger small">{{ form.non_field_errors }}</div>{% endif %}
          <div class="mb-3">
            <label class="form-label small fw-semibold" for="{{ form.username.id_for_label }}">Username or email</label>
            {{ form.username }}
          </div>
          <div class="mb-3">
            <label class="form-label small fw-semibold" for="{{ form.password.id_for_label }}">Password</label>
            {{ form.password }}
          </div>
          <input type="hidden" name="next" value="{{ next }}">
          <button class="btn btn-aqua w-100" type="submit">Login</button>
        </form>
        <div class="d-flex justify-content-between mt-3 small">
          <a href="{% url 'accounts:password_reset' %}" class="text-aqua">Forgot password?</a>
          <a href="{% url 'accounts:register' %}" class="text-aqua">Create an account</a>
        </div>
      </div>
    </div></div>
  </div>
</section>
{% endblock %}
