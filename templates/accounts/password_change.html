{% extends "base.html" %}
{% block content %}
<section class="section bg-aqua-soft"><div class="container"><div class="row justify-content-center"><div class="col-md-7 col-lg-5">
  <div class="form-panel">
    <h1 class="h4 mb-3">Change password</h1>
    <form method="post" novalidate>{% csrf_token %}
      {% for field in form %}
        <div class="mb-3"><label class="form-label small fw-semibold" for="{{ field.id_for_label }}">{{ field.label }}</label>
          <input type="password" name="{{ field.name }}" id="{{ field.id_for_label }}" class="form-control" required>
          {% for e in field.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}</div>
      {% endfor %}
      <button class="btn btn-aqua w-100">Update password</button>
    </form>
  </div>
</div></div></div></section>
{% endblock %}
