{% extends "base.html" %}
{% block content %}
<section class="section bg-aqua-soft"><div class="container"><div class="row justify-content-center"><div class="col-md-7 col-lg-5">
  <div class="form-panel">
    <h1 class="h4 mb-2">Reset your password</h1>
    <p class="small text-muted-soft">Enter your registered email and we'll send you a reset link.</p>
    <form method="post" novalidate>{% csrf_token %}
      <div class="mb-3"><label class="form-label small fw-semibold" for="{{ form.email.id_for_label }}">Email address</label>
        <input type="email" name="email" id="{{ form.email.id_for_label }}" class="form-control" required>
        {% for e in form.email.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}</div>
      <button class="btn btn-aqua w-100">Send reset link</button>
    </form>
  </div>
</div></div></div></section>
{% endblock %}
