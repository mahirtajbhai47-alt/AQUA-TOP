<div class="card-aqua p-3">
  <div class="text-center mb-3">
    {% if user.profile.avatar %}
      <img src="{{ user.profile.avatar.url }}" class="rounded-circle mb-2" width="72" height="72" style="object-fit:cover" alt="{{ user.get_full_name }}">
    {% else %}
      <div class="icon-circle mx-auto">{{ user.username|first|upper }}</div>
    {% endif %}
    <div class="fw-semibold">{{ user.get_full_name|default:user.username }}</div>
    <div class="small text-muted-soft">{{ user.email }}</div>
  </div>
  <ul class="list-unstyled d-grid gap-1 small mb-0">
    <li><a class="nav-link" href="{% url 'accounts:dashboard' %}"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a></li>
    <li><a class="nav-link" href="{% url 'accounts:my_orders' %}"><i class="bi bi-bag me-2"></i>My Orders</a></li>
    <li><a class="nav-link" href="{% url 'accounts:my_services' %}"><i class="bi bi-tools me-2"></i>My Service Requests</a></li>
    <li><a class="nav-link" href="{% url 'accounts:my_amc' %}"><i class="bi bi-shield-check me-2"></i>My AMC</a></li>
    <li><a class="nav-link" href="{% url 'accounts:my_quotations' %}"><i class="bi bi-file-earmark-text me-2"></i>My Quotations</a></li>
    <li><a class="nav-link" href="{% url 'accounts:profile' %}"><i class="bi bi-person me-2"></i>My Profile</a></li>
    <li><a class="nav-link" href="{% url 'accounts:password_change' %}"><i class="bi bi-key me-2"></i>Change Password</a></li>
    <li><a class="nav-link text-danger" href="{% url 'accounts:logout' %}"><i class="bi bi-box-arrow-right me-2"></i>Logout</a></li>
  </ul>
</div>
